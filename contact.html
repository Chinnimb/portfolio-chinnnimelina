// ── Service card with expandable process ──────────────────────────────────────
const ServiceCard = ({ icon, label, desc, color, process: steps, index }) => {
  const [open, setOpen] = React.useState(false);
  const { lang } = useT();
  const R = v => (v && typeof v === "object" ? (v[lang] || v.es) : v);
  return (
    <div className="reveal" style={{ transitionDelay: `${index * 70}ms`, height: "100%" }}>
      <div style={{
        background: "var(--paper)",
        borderRadius: 20,
        height: "100%",
        border: `1px solid ${open ? color : "rgba(43,36,32,0.07)"}`,
        transition: "border-color 0.25s, box-shadow 0.25s, transform 0.2s",
        boxShadow: open ? `0 12px 40px -10px rgba(43,36,32,0.13)` : "0 2px 16px -6px rgba(43,36,32,0.07)",
        position: "relative", overflow: "hidden",
        transform: open ? "translateY(-2px)" : "",
      }}>
        {/* accent bar */}
        <div style={{ position: "absolute", top: 0, left: 0, width: "100%", height: 3, background: color, borderRadius: "20px 20px 0 0", opacity: open ? 1 : 0.5, transition: "opacity 0.25s" }} />

        {/* header — always visible, clickable */}
        <button
          onClick={() => setOpen(o => !o)}
          style={{
            width: "100%", textAlign: "left", background: "none", border: "none",
            cursor: "pointer", padding: "28px 28px 24px", display: "flex", flexDirection: "column", gap: 12,
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <span style={{ color }}>{icon}</span>
            <span style={{
              fontFamily: "var(--font-mono)", fontSize: 11, color: open ? color : "var(--ink-mute)",
              transition: "color 0.2s", letterSpacing: "0.06em",
              display: "flex", alignItems: "center", gap: 6,
            }}>
              {open ? (lang === "en" ? "close" : "cerrar") : (lang === "en" ? "see process" : "ver proceso")}
              <span style={{ display: "inline-block", transform: open ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.25s", fontSize: 13 }}>↓</span>
            </span>
          </div>
          <h3 style={{ fontSize: 20, margin: 0, lineHeight: 1.2, color: "var(--ink)" }}>{R(label)}</h3>
          <p style={{ fontSize: 15, color: "var(--ink-soft)", lineHeight: 1.6, margin: 0 }}>{R(desc)}</p>
        </button>

        {/* expandable process */}
        <div style={{
          maxHeight: open ? 500 : 0,
          overflow: "hidden",
          transition: "max-height 0.4s cubic-bezier(0.4,0,0.2,1)",
        }}>
          <div style={{
            padding: "0 28px 28px",
            borderTop: `1px solid rgba(43,36,32,0.08)`,
            paddingTop: 20,
          }}>
            <div className="mono" style={{ fontSize: 10, color: color, letterSpacing: "0.12em", marginBottom: 16 }}>{lang === "en" ? "— MY PROCESS" : "— MI PROCESO"}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {steps.map(({ step, title, body }) => (
                <div key={step} style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
                  <div style={{
                    fontFamily: "var(--font-hand)", fontSize: 22, color: color, opacity: 0.6,
                    lineHeight: 1, flexShrink: 0, width: 28,
                  }}>{step}</div>
                  <div>
                    <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink)", marginBottom: 3, letterSpacing: "0.04em" }}>{R(title)}</div>
                    <div style={{ fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.55 }}>{R(body)}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Services (carrusel con flechas, como en el inicio) ───────────────────────
const Services = () => {
  const trackRef = React.useRef(null);
  const [edges, setEdges] = React.useState({ start: true, end: false });
  const updateEdges = () => {
    const el = trackRef.current;
    if (!el) return;
    setEdges({ start: el.scrollLeft <= 4, end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 4 });
  };
  React.useEffect(() => {
    updateEdges();
    window.addEventListener("resize", updateEdges);
    return () => window.removeEventListener("resize", updateEdges);
  }, []);
  const step = (dir) => {
    const el = trackRef.current;
    const card = el.querySelector(".svc-slide");
    const gap = parseFloat(getComputedStyle(el).columnGap) || 20;
    el.scrollBy({ left: dir * (card.offsetWidth + gap), behavior: "smooth" });
  };
  return (
    <section style={{ paddingTop: 20, paddingBottom: 100, position: "relative" }}>
      <div className="container">
        <div className="section-head reveal">
          <div className="eyebrow"><Tx es="Servicios" en="Services" /></div>
          <h2><Tx es="Servicios que " en="Services I " /><em><Tx es="ofrezco" en="offer" /></em></h2>
          <p><Tx es="Hacé click en cada servicio para ver cómo trabajo." en="Click each service to see how I work." /></p>
        </div>
      </div>
      <div className="slider reveal">
        <div className="slider-track svc-track" ref={trackRef} onScroll={updateEdges}>
          {SERVICES.map((s, i) => (
            <div key={s.label.es || s.label} className="svc-slide"><ServiceCard {...s} index={i} /></div>
          ))}
        </div>
        <div className="slider-nav">
          <button type="button" className="slider-arrow" onClick={() => step(-1)} disabled={edges.start} aria-label="Previous service">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          </button>
          <button type="button" className="slider-arrow" onClick={() => step(1)} disabled={edges.end} aria-label="Next service">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>
    </section>
  );
};
