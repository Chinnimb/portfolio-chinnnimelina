const Lazy = ({ src, poster, label }) => {
  // El video recién se carga cuando entra en pantalla
  const ref = React.useRef(null);
  React.useEffect(() => {
    const v = ref.current; if (!v) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { if (!v.src) v.src = src; v.play().catch(() => {}); } else v.pause(); }, { threshold: 0.2 });
    io.observe(v); return () => io.disconnect();
  }, [src]);
  return <video ref={ref} muted loop playsInline preload="none" poster={poster} aria-label={label} />;
};
