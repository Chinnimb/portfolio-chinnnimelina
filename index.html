// Orden: UX/UI, AI Native Designer, E-commerce, Branding, Imágenes y video con IA
const SERVICE_TINTS = ["periwinkle", "sage", "pink", "lilac", "sky"];

const Services = () => {
  const { t } = useT();
  const s = t.studio;
  const trackRef = React.useRef(null);
  const [edges, setEdges] = React.useState({ start: true, end: false });
  const [requested, setRequested] = React.useState(null); // servicio elegido para el formulario
  // "Cómo trabajo" se despliega en todas las cards a la vez para que queden parejas
  const [showProcess, setShowProcess] = React.useState(false);

  const updateEdges = () => {
    const el = trackRef.current;
    if (!el) return;
    setEdges({ start: el.scrollLeft <= 4, end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 4 });
  };
  React.useEffect(() => {
    updateEdges();
    window.addEventListener("resize", updateEdges);
    return () => window.removeEventListener("resize", updateEdges);
  }, []);

  // Avanza una card por click
  const step = (dir) => {
    const el = trackRef.current;
    const card = el.querySelector(".service-card");
    const gap = parseFloat(getComputedStyle(el).columnGap) || 24;
    el.scrollBy({ left: dir * (card.offsetWidth + gap), behavior: "smooth" });
  };

  return (
    <section className="services" id="servicios">
      <Doodle name="lamp" style={{ top: 70, left: "6%" }} rotate={-6} />
      <Doodle name="stars" style={{ top: 110, right: "9%" }} />
      <div className="container">
        <div className="section-head reveal">
          <div className="eyebrow">{s.servicesKicker}</div>
          <Rich as="h2" html={s.servicesTitle} />
          <p>{s.servicesLede}</p>
        </div>
      </div>
      <div className="slider reveal">
        <div className="slider-track" ref={trackRef} onScroll={updateEdges}>
          {s.services.map((sv, i) => (
            <article key={sv.title} className="service-card" data-tint={SERVICE_TINTS[i % SERVICE_TINTS.length]}>
              <div className="service-icon" aria-hidden="true">{SERVICE_ICONS[i]}</div>
              <div className="service-num">0{i + 1}</div>
              <h3>{sv.title}</h3>
              <p>{sv.desc}</p>
              <ul className="service-list">
                {sv.items.map(item => <li key={item}>{item}</li>)}
              </ul>
              <div className={`service-more ${showProcess ? "open" : ""}`} id={`svc-more-${i}`}>
                <ol className="service-process">
                  {sv.process.map(([title, desc], n) => (
                    <li key={title}><span>0{n + 1}</span><div><strong>{title}</strong><p>{desc}</p></div></li>
                  ))}
                </ol>
              </div>
              <button type="button" className="service-toggle" aria-expanded={showProcess} aria-controls={`svc-more-${i}`} onClick={() => setShowProcess(o => !o)}>
                {showProcess ? s.lessLabel : s.moreLabel}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M7 7l5 5 5-5M7 13l5 5 5-5" /></svg>
              </button>
              <button type="button" className="btn btn-outline service-cta" onClick={() => setRequested(sv.title)}>
                {s.requestCta} <Arrow />
              </button>
            </article>
          ))}
        </div>
        <div className="slider-nav">
          <button type="button" className="slider-arrow" onClick={() => step(-1)} disabled={edges.start} aria-label={s.prevLabel}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          </button>
          <button type="button" className="slider-arrow" onClick={() => step(1)} disabled={edges.end} aria-label={s.nextLabel}>
            <Arrow size={18} />
          </button>
        </div>
      </div>
      {requested && <RequestModal service={requested} onClose={() => setRequested(null)} />}
    </section>
  );
};

// === Carrusel que avanza solo y también se arrastra (mouse o dedo) ===
// Los hijos tienen que venir duplicados (lista + copia) para que el loop sea continuo.
const DragMarquee = ({ children, speed = 40 /* px por segundo */ }) => {
  const viewportRef = React.useRef(null);
  const trackRef = React.useRef(null);

  React.useEffect(() => {
    const vp = viewportRef.current, tr = trackRef.current;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const gap = parseFloat(getComputedStyle(tr).columnGap) || 0;
    const loopWidth = () => (tr.scrollWidth + gap) / 2; // ancho de una vuelta (una lista + su gap)

    // Arranca con la primera card entera a la vista, después del difuminado del borde
    const startOffset = Math.max(24, (vp.clientWidth - 1200) / 2 + 40);
    let x = startOffset - loopWidth();
    let hovering = false, pressed = false, dragging = false;
    let downX = 0, downPos = 0, velocity = 0, lastX = 0, lastT = 0, last = performance.now(), raf;

    const wrap = () => {
      const L = loopWidth();
      let shift = 0;
      while (x <= -L) { x += L; shift += L; }
      while (x > 0) { x -= L; shift -= L; }
      return shift;
    };
    const render = () => { tr.style.transform = `translate3d(${x}px, 0, 0)`; };

    const tick = (t) => {
      const dt = Math.min(64, t - last) / 1000;
      last = t;
      if (!dragging) {
        if (Math.abs(velocity) > 8) {            // inercia después de soltar
          x += velocity * dt;
          velocity *= Math.pow(0.03, dt);
        } else if (!hovering && !reduceMotion) { // avance automático
          velocity = 0;
          x -= speed * dt;
        }
        wrap();
        render();
      }
      raf = requestAnimationFrame(tick);
    };

    const onDown = (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      pressed = true; dragging = false;
      downX = lastX = e.clientX; downPos = x; lastT = performance.now(); velocity = 0;
    };
    const onMove = (e) => {
      if (!pressed) return;
      const dx = e.clientX - downX;
      if (!dragging && Math.abs(dx) > 6) {
        dragging = true;
        vp.classList.add("is-dragging");
        vp.setPointerCapture?.(e.pointerId); // recién acá, para que un click simple siga abriendo el proyecto
      }
      if (!dragging) return;
      x = downPos + dx;
      downPos += wrap();
      render();
      const now = performance.now();
      const dtm = Math.max(1, now - lastT);
      velocity = 0.8 * ((e.clientX - lastX) / dtm) * 1000 + 0.2 * velocity;
      lastX = e.clientX; lastT = now;
    };
    const onUp = () => {
      if (performance.now() - lastT > 120) velocity = 0; // si se quedó quieto antes de soltar, sin inercia
      pressed = false;
      // dejamos "dragging" activo hasta después del click para poder cancelarlo
      setTimeout(() => { dragging = false; vp.classList.remove("is-dragging"); }, 0);
    };
    const onClick = (e) => { if (dragging) { e.preventDefault(); e.stopPropagation(); } };
    const onEnter = (e) => { if (e.pointerType === "mouse") hovering = true; };
    const onLeave = () => { hovering = false; };
    const noNativeDrag = (e) => e.preventDefault();

    vp.addEventListener("pointerdown", onDown);
    vp.addEventListener("pointermove", onMove);
    vp.addEventListener("pointerup", onUp);
    vp.addEventListener("pointercancel", onUp);
    vp.addEventListener("pointerenter", onEnter);
    vp.addEventListener("pointerleave", onLeave);
    vp.addEventListener("click", onClick, true);
    vp.addEventListener("dragstart", noNativeDrag);
    render();
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      vp.removeEventListener("pointerdown", onDown);
      vp.removeEventListener("pointermove", onMove);
      vp.removeEventListener("pointerup", onUp);
      vp.removeEventListener("pointercancel", onUp);
      vp.removeEventListener("pointerenter", onEnter);
      vp.removeEventListener("pointerleave", onLeave);
      vp.removeEventListener("click", onClick, true);
      vp.removeEventListener("dragstart", noNativeDrag);
    };
  }, []);

  return (
    <div className="carousel drag-marquee" ref={viewportRef}>
      <div className="carousel-track" ref={trackRef}>{children}</div>
    </div>
  );
};

const Works = () => {

  const s = t.studio;
  const [aleo, flok, ecommerce] = t.work.projects;
  const projects = [

      title: "Protocol · Health Club",
      cat: lang === "es" ? "Web + IA · Salud" : "Web + AI · Health",
      desc: lang === "es"
        ? "Web de un club de salud con fotografía y video de producto generados con IA."
        : "Website for a health club with AI-generated product photography and video.",
    },
    {
      id: "ctp", tags: ["web", "app"], href: "case-ctp.html", img: "assets/photos/ctp/home.jpg",
      title: "CompraTuParcela",
      cat: lang === "es" ? "Marketplace · Producto digital" : "Marketplace · Digital product",
      desc: lang === "es"
        ? "Plataforma para comprar y vender parcelas: sitio público y paneles para personas, inmobiliarias, brokers y admin."
        : "Platform to buy and sell land: public site and dashboards for individuals, agencies, brokers and admins.",
    },
    {
      id: "pawcare", tags: ["app"], href: "case-pawcare.html", img: "assets/photos/pawcare/cover.jpg",
      title: "PawCare",
      cat: lang === "es" ? "App veterinaria · AI Native" : "Vet app · AI Native",
      desc: lang === "es"
        ? "App mobile para una clínica veterinaria, con una experiencia para tutores y otra para veterinarios."
        : "Mobile app for a vet clinic, with one experience for pet owners and another for vets.",
    },
    {
      id: "alicia", tags: ["web"], href: "case-alicia.html", img: "assets/photos/alicia/recorrido-poster.jpg",
      title: "Alicia Erickson · VIP Community",
      cat: lang === "es" ? "Coaching · Landing page" : "Coaching · Landing page",
      desc: lang === "es"
        ? "Diseño y desarrollo de la landing de una comunidad de coaching para mujeres, de Figma a un sitio publicado."
        : "Design and development of a women's coaching community landing page, from Figma to a live site.",
    },
    {
      id: "nor", tags: ["branding", "ai"], href: "case-nor.html", img: "assets/photos/nor/video-poster.jpg", video: "assets/photos/nor/video.mp4",

      cat: lang === "es" ? "Branding · Imágenes con IA" : "Branding · AI imagery",
      desc: lang === "es"

        : "Visual identity for a Patagonian kayak brand, with AI-generated photography and video.",
    },
    {
      id: "hisoil", tags: ["web", "ecommerce", "ai"], href: "case-hisoil.html", img: "assets/photos/hisoil/video-poster.jpg", video: "assets/photos/hisoil/video.mp4",
      title: lang === "es" ? "Hisoil · Rediseño Web" : "Hisoil · Web Redesign",
      cat: "Web design · Agro",
      desc: lang === "es"
        ? "Rediseño completo del sitio de una empresa de sustratos con 22 años de trayectoria, junto a Shifra Studio."
        : "Full website redesign for a substrate company with 22 years in the field, together with Shifra Studio.",
    },
    { id: "aleo", tags: ["branding"], href: "case-aleo.html", img: "assets/photos/aleo-cover.jpg", title: aleo.title, cat: aleo.subtitle, desc: aleo.desc },
    { id: "flok", tags: ["app"], href: "case-flok.html", img: "assets/photos/Image 1.jpg", title: flok.title, cat: flok.subtitle, desc: flok.desc },
  ];

  const Card = ({ p, hidden }) => (
    <a href={p.href} className="work-card" aria-hidden={hidden || undefined} tabIndex={hidden ? -1 : undefined}>

  const [filter, setFilter] = React.useState("all");
  const shown = filter === "all" ? projects : projects.filter(p => p.tags.includes(filter));

  return (

      <div className="container">
        <div className="section-head reveal">
          <div className="eyebrow">{s.workKicker}</div>
          <Rich as="h2" html={s.workTitle} />

        </div>
        <div className="work-filters reveal" role="group" aria-label={s.filtersLabel}>
          {s.filters.map(f => (
            <button key={f.id} type="button" className={`pill ${filter === f.id ? "active" : ""}`} aria-pressed={filter === f.id} onClick={() => setFilter(f.id)}>
              {f.label}
            </button>
          ))}
        </div>

      {filter === "all" ? (

          <a href="work.html" className="btn btn-primary">{s.seeAll} <Arrow /></a>
        </div>
      </div>
    </section>

};

  useReveal();
  return (
    <LangProvider>
      <Nav active="home" overlay />
      <Hero />
      <Services />
      <Works />
      <ContactCTA />
      <Footer />
      <TweaksPanel />
    </LangProvider>

};
