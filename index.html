<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chinni Design Studio · Melina Chinni</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Chinni Design Studio — UX/UI, branding y diseño de producto por Melina Chinni, desde Buenos Aires.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/video/hero-poster.jpg">
<link rel="stylesheet" href="assets/shared.css">
</head>
<body class="home" data-palette="niebla" data-fonts="default">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="assets/i18n.jsx"></script>
<script type="text/babel" src="assets/components.jsx"></script>

<script type="text/babel">
// Permite <em> en los títulos que vienen de i18n
const Rich = ({ as: Tag = "span", html, ...rest }) => <Tag {...rest} dangerouslySetInnerHTML={{ __html: html }} />;

const Arrow = ({ size = 16 }) => (
  <svg className="arrow" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d="M5 12h14M13 6l6 6-6 6" />
  </svg>
);

const Hero = () => {
  const { t } = useT();
  const s = t.studio;
  const videoRef = React.useRef(null);
  React.useEffect(() => {
    // Respeta "reducir movimiento": deja el póster quieto
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches && videoRef.current) {
      videoRef.current.pause();
    }
  }, []);
  return (
    <section className="studio-hero">
      <video ref={videoRef} autoPlay muted loop playsInline preload="auto" poster="assets/video/hero-poster.jpg" aria-hidden="true">
        <source src="assets/video/hero.mp4" type="video/mp4" />
      </video>
      <div className="studio-hero-inner">
        <div className="studio-kicker rise">{s.kicker}</div>
        <h1 className="studio-title rise d1">Chinni<br/><em>Design Studio</em></h1>
        <p className="studio-lede rise d2">{s.lede}</p>
        <div className="studio-ctas rise d3">
          <a href="#trabajos" className="btn btn-primary">{s.cta1} <Arrow /></a>
          <a href="#contacto" className="btn btn-ghost-light">{s.cta2}</a>
        </div>
      </div>
      <div className="scroll-cue" aria-hidden="true"></div>
    </section>
  );
};

const Services = () => {
  const { t } = useT();
  const s = t.studio;
  return (
    <section className="services" id="servicios">
      <div className="container">
        <div className="section-head reveal">
          <div className="eyebrow">{s.servicesKicker}</div>
          <Rich as="h2" html={s.servicesTitle} />
          <p>{s.servicesLede}</p>
        </div>
        <div className="services-grid">
          {s.services.map((sv, i) => (
            <article key={sv.title} className="service-card reveal" style={{ transitionDelay: `${i * 90}ms` }}>
              <div className="service-num">0{i + 1}</div>
              <h3>{sv.title}</h3>
              <p>{sv.desc}</p>
              <ul className="service-list">
                {sv.items.map(item => <li key={item}>{item}</li>)}
              </ul>
              <div className="service-tools">{sv.tools}</div>
            </article>
          ))}
        </div>
      </div>
    </section>
  );
};

const Works = () => {
  const { t, lang } = useT();
  const s = t.studio;
  const [aleo, flok, ecommerce] = t.work.projects;
  const projects = [
    {
      // Sin foto todavía: las imágenes de assets/photos/hisoil/ no están en el repo
      id: "hisoil", href: "case-hisoil.html", cover: { label: "Hisoil", bg: "linear-gradient(135deg, #0e2a14 0%, #1a4a22 50%, #2d6b35 100%)" },
      title: lang === "es" ? "Hisoil · Rediseño Web" : "Hisoil · Web Redesign",
      cat: "Web design · Agro",
      desc: lang === "es"
        ? "Rediseño completo del sitio de una empresa de sustratos con 22 años de trayectoria, junto a Shifra Studio."
        : "Full website redesign for a substrate company with 22 years in the field, together with Shifra Studio.",
    },
    { id: "aleo", href: "case-aleo.html", img: "assets/photos/aleo-cover.jpg", title: aleo.title, cat: aleo.subtitle, desc: aleo.desc },
    { id: "flok", href: "case-flok.html", img: "assets/photos/Image 1.jpg", title: flok.title, cat: flok.subtitle, desc: flok.desc },
    { id: "ecommerce", href: "case-ecommerce.html", img: "assets/work/ecommerce.svg", title: ecommerce.title, cat: ecommerce.subtitle, desc: ecommerce.desc },
  ];
  return (
    <section className="works" id="trabajos">
      <div className="container">
        <div className="section-head reveal">
          <div className="eyebrow">{s.workKicker}</div>
          <Rich as="h2" html={s.workTitle} />
          <p>{s.workLede}</p>
        </div>
        <div className="works-grid">
          {projects.map((p, i) => (
            <a key={p.id} href={p.href} className="work-card reveal" style={{ transitionDelay: `${(i % 2) * 90}ms` }}>
              <div className="work-media">
                {p.cover
                  ? <div className="work-cover" style={{ background: p.cover.bg }}>{p.cover.label}</div>
                  : <img src={p.img} alt={p.title} loading="lazy" />}
              </div>
              <div className="work-body">
                <div>
                  <div className="work-cat">{p.cat}</div>
                  <h3>{p.title}</h3>
                  <p>{p.desc}</p>
                </div>
                <span className="work-arrow" aria-hidden="true"><Arrow size={18} /></span>
              </div>
            </a>
          ))}
        </div>
        <div className="works-more reveal">
          <a href="work.html" className="btn btn-primary">{s.seeAll} <Arrow /></a>
        </div>
      </div>
    </section>
  );
};

const Contact = () => {
  const { t } = useT();
  const s = t.studio;
  const email = t.contact.email;
  return (
    <section className="contact-band" id="contacto">
      <div className="container-narrow reveal">
        <div className="eyebrow">{s.contactKicker}</div>
        <Rich as="h2" html={s.contactTitle} />
        <p className="lede">{s.contactLede}</p>
        <a href={`mailto:${email}`} className="btn btn-dark">{s.contactCta} <Arrow /></a>
        <div className="contact-links">
          <a href={`mailto:${email}`} className="chip-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            {email}
          </a>
          <a href="https://www.linkedin.com/in/melinachinni/" target="_blank" rel="noopener" className="chip-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
            LinkedIn
          </a>
          <a href="https://wa.me/5491122896457" target="_blank" rel="noopener" className="chip-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
            WhatsApp
          </a>
        </div>
      </div>
    </section>
  );
};

const App = () => {
  useReveal();
  return (
    <LangProvider>
      <Nav active="home" overlay />
      <Hero />
      <Services />
      <Works />
      <Contact />
      <Footer />
      <TweaksPanel />
    </LangProvider>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
