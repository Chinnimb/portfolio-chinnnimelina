/* ─── BEFORE / AFTER ─────────────────────────────────────────────────────────*/
const BeforeAfter = ({ c }) => {
  const [tab, setTab] = React.useState("antes");
  const [idx, setIdx] = React.useState(0);
  const [fading, setFading] = React.useState(false);
  const slides = tab === "antes" ? BEFORE_SLIDES : AFTER_SLIDES;

  const goTo = (i) => {
    setFading(true);
    setTimeout(() => { setIdx(i); setFading(false); }, 280);
  };

  React.useEffect(() => {
    setIdx(0);
  }, [tab]);

  const tabStyle = (active) => ({
    padding: "10px 28px", borderRadius: 100,
    border: "1px solid " + (active ? "var(--ink)" : "rgba(28,43,58,0.15)"),
    background: active ? "var(--ink)" : "transparent",
    color: active ? "var(--cream)" : "var(--ink-soft)",
    fontFamily: "var(--font-mono)", fontSize: 12, letterSpacing: "0.06em",
    cursor: "pointer", transition: "all 0.2s",
  });

  return (
    <section>
      <div className="container">
        <div className="reveal" style={{ textAlign: "center", marginBottom: 40 }}>
          <div className="mono" style={{ color: "var(--ink-mute)", marginBottom: 16, letterSpacing: "0.15em" }}>{c.beforeAfter}</div>
          <h2>La transformación visual</h2>
          <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 28 }}>
            <button style={tabStyle(tab === "antes")} onClick={() => setTab("antes")}>← Antes · WooCommerce</button>
            <button style={tabStyle(tab === "despues")} onClick={() => setTab("despues")}>Después · Nuevo diseño →</button>
          </div>
        </div>

        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div className="polaroid" style={{ padding: "12px 12px 20px", transform: tab === "antes" ? "rotate(1.5deg)" : "rotate(-1deg)", transition: "transform 0.4s ease" }}>
            <div style={{
              position: "relative", overflow: "hidden", borderRadius: 2,
              background: tab === "antes"
                ? "linear-gradient(135deg, #e8f0e0, #d0e0c0)"
                : "linear-gradient(135deg, #0e2a14 0%, #1a4a22 100%)",
              aspectRatio: "16/9",
            }}>
              <img
                src={slides[idx]}
                alt={`Hisoil ${tab} — pantalla ${idx + 1}`}
                style={{
                  width: "100%", height: "100%", objectFit: "cover",
                  display: "block",
                  transition: "opacity 0.28s ease",
                  opacity: fading ? 0 : 1,
                }}
                onError={e => { e.target.style.opacity = 0; }}
              />
              {/* Label overlay */}
              <div style={{
                position: "absolute", top: 12, left: 12,
                background: tab === "antes" ? "rgba(255,255,255,0.85)" : "rgba(10,40,16,0.85)",
                color: tab === "antes" ? "var(--ink)" : "#b4e645",
                fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.1em",
                padding: "4px 12px", borderRadius: 100,
              }}>
                {tab === "antes" ? "hisoil.com.ar · WooCommerce" : "hisoil.vercel.app · React + Tailwind"}
              </div>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 20, marginTop: 20 }}>
            <button onClick={() => goTo((idx - 1 + slides.length) % slides.length)} style={{ background: "none", border: "none", cursor: "pointer", fontFamily: "var(--font-mono)", fontSize: 18, color: "var(--ink-soft)", padding: 0, opacity: 0.7 }}>←</button>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-mute)", letterSpacing: "0.1em" }}>{idx + 1} / {slides.length}</span>
            <button onClick={() => goTo((idx + 1) % slides.length)} style={{ background: "none", border: "none", cursor: "pointer", fontFamily: "var(--font-mono)", fontSize: 18, color: "var(--ink-soft)", padding: 0, opacity: 0.7 }}>→</button>
          </div>

          <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 12 }}>
            {slides.map((_, i) => (
              <button key={i} onClick={() => goTo(i)} style={{
                width: i === idx ? 20 : 8, height: 8, borderRadius: 100,
                background: i === idx ? "var(--rust)" : "var(--sage)",
                border: "none", cursor: "pointer", padding: 0, transition: "all 0.3s ease",
              }} />
            ))}
          </div>
        </div>
      </div>
    </section>
  );
};

            <WashiTape width={70} rotate={-6} style={{ position: "absolute", top: -10, left: "50%", transform: "translateX(-50%)" }} />
            <div style={{
              aspectRatio: "4/3",
              background: `linear-gradient(135deg, ${mb.colors[0]} 0%, ${mb.colors[1]} 50%, ${mb.colors[2]} 100%)`,
              borderRadius: 2, marginBottom: 14,
              display: "flex", alignItems: "flex-end", padding: 16, position: "relative", overflow: "hidden",
            }}>
              <div style={{ position: "absolute", top: 14, left: 14 }}>
                <div style={{ display: "flex", gap: 4 }}>
                  {mb.colors.map(c => (
                    <div key={c} style={{ width: 14, height: 14, borderRadius: 2, background: c, border: "1px solid rgba(255,255,255,0.2)" }} />
                  ))}
                </div>
              </div>
              <div style={{ fontFamily: "'Caveat', cursive", fontSize: 42, color: "rgba(255,255,255,0.9)", lineHeight: 1 }}>
                {mb.n}
              </div>
            </div>
            <div className="mono" style={{ fontSize: 10, color: "var(--ink-mute)", marginBottom: 6, letterSpacing: "0.1em" }}>MOODBOARD {mb.n}</div>
            <h3 style={{ fontSize: 22, marginBottom: 8, lineHeight: 1.1 }}>{mb.name}</h3>
            <p style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.55, marginBottom: 12 }}>{mb.desc}</p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {mb.keywords.map(k => (
                <span key={k} className="mono" style={{ fontSize: 10, padding: "3px 10px", borderRadius: 100, background: "var(--cream)", border: "1px solid rgba(28,43,58,0.1)", color: "var(--ink-soft)" }}>{k}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  </section>
);

/* ─── DELIVERABLES ───────────────────────────────────────────────────────────*/
const Deliverables = ({ c }) => (
  <section style={{ background: "var(--cream)" }}>
    <div className="container" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 80, alignItems: "center" }}>
      <div className="reveal">
        <div className="mono" style={{ color: "var(--rust)", marginBottom: 16, letterSpacing: "0.12em" }}>{c.deliverables.label}</div>
        <h2 style={{ marginBottom: 32, fontSize: "clamp(28px, 3.5vw, 44px)" }}>Qué incluye el proyecto</h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {c.deliverables.items.map((item, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 16, padding: "14px 0", borderBottom: "1px dashed rgba(28,43,58,0.12)" }}>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--rust)", minWidth: 32 }}>0{i+1}</span>
              <span style={{ fontSize: 16, color: "var(--ink)" }}>{item}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="reveal">
        {/* Visual del nuevo sitio */}
        <div style={{
          background: "linear-gradient(135deg, #0e2a14 0%, #1a4a22 50%, #2d6b35 100%)",
          borderRadius: 18, padding: 36, color: "#f0ece2", position: "relative", overflow: "hidden",
        }}>
          <div style={{ fontFamily: "'Caveat', cursive", fontSize: 13, color: "#b4e645", letterSpacing: "0.1em", marginBottom: 12, opacity: 0.8 }}>HISOIL · 2025</div>
          <div style={{ fontFamily: "var(--font-serif)", fontSize: 36, lineHeight: 1.1, marginBottom: 16, fontStyle: "italic" }}>
            Energía para<br/>cultivar el futuro.
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {["Agricultura", "Horticultura", "Jardinería", "Infraestructura", "Sustratos"].map(l => (
              <span key={l} style={{ fontFamily: "var(--font-mono)", fontSize: 10, padding: "3px 10px", borderRadius: 100, background: "rgba(180,230,69,0.15)", border: "1px solid rgba(180,230,69,0.3)", color: "#b4e645", letterSpacing: "0.05em" }}>{l}</span>
            ))}
          </div>
          <div style={{ position: "absolute", bottom: -20, right: -10, fontFamily: "'Caveat', cursive", fontSize: 120, color: "rgba(180,230,69,0.06)", lineHeight: 1, userSelect: "none" }}>Hi.</div>
        </div>
        {/* Collab badge */}
        <div style={{ marginTop: 20, padding: "16px 20px", background: "var(--paper)", borderRadius: 12, display: "flex", alignItems: "center", gap: 14 }}>
          <img src="assets/photos/hisoil/shifra-logo.png" alt="Shifra Studio" style={{ height: 32, width: "auto" }} onError={e => { e.target.style.display = "none"; }} />
          <div>
            <div className="mono" style={{ fontSize: 10, color: "var(--ink-mute)", letterSpacing: "0.1em" }}>{c.collab.label}</div>
            <div style={{ fontSize: 14, color: "var(--ink)" }}>{c.collab.text} <a href={c.collab.url} target="_blank" rel="noopener" style={{ color: "var(--olive-deep)", fontWeight: 600 }}>{c.collab.studio}</a></div>
          </div>
        </div>
      </div>
    </div>
  </section>
);

/* ─── RESULTS ────────────────────────────────────────────────────────────────*/
const Results = ({ c }) => (
  <section style={{ position: "relative", overflow: "hidden" }}>
    <ParallaxSticker speed={-0.1} top="10%" right="5%">
      <CircleSticker size={60} color="var(--rust-soft)" />
    </ParallaxSticker>
    <div className="container">
      <div className="reveal" style={{ textAlign: "center", marginBottom: 56 }}>
        <div className="mono" style={{ color: "var(--rust)", marginBottom: 16, letterSpacing: "0.12em" }}>{c.results.label}</div>
        <h2 style={{ marginBottom: 24 }}>{c.results.title}</h2>
        <p style={{ fontSize: 18, color: "var(--ink-soft)", maxWidth: 600, margin: "0 auto" }}>{c.results.body}</p>
      </div>
      <div style={{ display: "flex", gap: 32, justifyContent: "center", flexWrap: "wrap", marginTop: 48 }}>
        {c.results.stats.map((s, i) => (
          <div key={i} className="reveal polaroid" style={{ padding: "28px 36px 36px", textAlign: "center", transform: `rotate(${(i-1)*3}deg)`, transitionDelay: `${i*80}ms`, position: "relative" }}>
            <WashiTape width={70} rotate={-6} style={{ position: "absolute", top: -10, left: "50%", transform: "translateX(-50%)" }} />
            <div style={{ fontFamily: "var(--font-serif)", fontSize: 52, lineHeight: 1, color: "var(--olive-deep)", letterSpacing: "-0.02em" }}>{s.value}</div>
            <div className="mono" style={{ color: "var(--ink-mute)", fontSize: 12, marginTop: 8 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Link al sitio live */}
      <div className="reveal" style={{ textAlign: "center", marginTop: 60 }}>
        <a href="https://hisoil.vercel.app" target="_blank" rel="noopener" style={{
          display: "inline-flex", alignItems: "center", gap: 10,
          padding: "14px 28px", background: "var(--cream)", border: "1px solid rgba(28,43,58,0.15)",
          borderRadius: 100, fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink)",
          textDecoration: "none", letterSpacing: "0.05em",
          transition: "all 0.2s",
        }}
        onMouseEnter={e => { e.currentTarget.style.background = "var(--ink)"; e.currentTarget.style.color = "var(--cream)"; }}
        onMouseLeave={e => { e.currentTarget.style.background = "var(--cream)"; e.currentTarget.style.color = "var(--ink)"; }}
        >
          Ver el sitio live ↗
        </a>
      </div>
    </div>
  </section>
);

/* ─── NAV ────────────────────────────────────────────────────────────────────*/
const CaseNav = ({ c }) => (
  <section style={{ paddingTop: 60, paddingBottom: 60, textAlign: "center" }}>
    <div className="container-narrow">
      <div style={{ display: "flex", gap: 20, justifyContent: "center", flexWrap: "wrap" }}>
        <a href="work.html" style={{
          display: "inline-flex", alignItems: "center", gap: 10,
          padding: "16px 32px", background: "var(--ink)", color: "var(--cream)",
          borderRadius: 100, fontFamily: "var(--font-mono)", fontSize: 13, letterSpacing: "0.05em",
          textDecoration: "none",
        }}>{c.back}</a>
        <a href="index.html#contact" style={{
          display: "inline-flex", alignItems: "center", gap: 10,
          padding: "16px 32px", background: "transparent", border: "1px solid var(--ink)", color: "var(--ink)",
          borderRadius: 100, fontFamily: "var(--font-mono)", fontSize: 13, letterSpacing: "0.05em",
          textDecoration: "none",
        }}>¿Trabajamos juntos? →</a>
      </div>
    </div>
  </section>
);

/* ─── APP ─────────────────────────────────────────────────────────────────────*/
const CaseHeroWrapper = () => {
  const { lang } = React.useContext(LangContext);
  const c = CONTENT[lang] || CONTENT.es;
  return (
    <>
      <CaseHero c={c} />
      <Overview c={c} />
      <Challenge c={c} />
      <BeforeAfter c={c} />
      <Process c={c} />
      <MoodboardsSection />
      <Deliverables c={c} />
      <Results c={c} />
      <CaseNav c={c} />
    </>
  );
};

const App = () => {
  useReveal();
  return (
    <LangProvider>
      <CursorSticker />
      <Nav active="work" />
      <CaseHeroWrapper />
      <Footer />
      <TweaksPanel />
    </LangProvider>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
