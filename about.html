);

    </div>

  useReveal();
  return (

      <Approach c={c} />
      <Clients c={c} />
      <Timeline c={c} />
      <Tools c={c} />
      <Testimonials c={c} />
      <End c={c} />

  <LangProvider>
    <Nav active="about" />

    <Footer />
